<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="prlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    
    <!-- Primary Teal / Cyan Gradient -->
    <linearGradient id="prlCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Medical Emerald Gradient -->
    <linearGradient id="prlEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="prlDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="5" y="5" width="190" height="190" rx="39" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/>

  <!-- Inner Badge Frame -->
  <g filter="url(#prlDropShadow)">
    <rect x="24" y="24" width="152" height="102" rx="22" fill="#0C4A6E"/>
    
    <!-- Laboratory DNA / Flask Icon Graphic -->
    <!-- Flask Outline & Liquid -->
    <path d="M88 40 L112 40 L112 56 L132 88 C136 94 132 104 122 104 L78 104 C68 104 64 94 68 88 L88 56 Z" fill="#0369A1" opacity="0.6"/>
    <path d="M92 64 L108 64 L126 92 C129 97 125 101 119 101 L81 101 C75 101 71 97 74 92 Z" fill="url(#prlCyanGrad)"/>
    
    <!-- Medical Plus Symbol inside flask -->
    <rect x="96" y="74" width="8" height="20" rx="2.5" fill="#FFFFFF"/>
    <rect x="90" y="80" width="20" height="8" rx="2.5" fill="#FFFFFF"/>

    <!-- Subtle Bubbles -->
    <circle cx="91" cy="70" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="109" cy="68" r="2.5" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- Clean Bold Typography -->
  <!-- "PRL" Monogram -->
  <text x="100" y="156" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="28" 
        fill="#0C4A6E" 
        text-anchor="middle" 
        letter-spacing="1">PRL</text>

  <!-- "LABORATORY" Subtitle -->
  <text x="100" y="176" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="10" 
        fill="#0284C7" 
        text-anchor="middle" 
        letter-spacing="2.5">LABORATORY</text>
</svg>
